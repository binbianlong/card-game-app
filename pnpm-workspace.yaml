packages:
  - apps/*
  - packages/*
  - tools/*

catalogMode: prefer

catalog:
  "@types/node": ^24.12.4
  typescript: ^5
  vite: npm:@voidzero-dev/vite-plus-core@latest
  vitest: npm:@voidzero-dev/vite-plus-test@latest
  vite-plus: latest
  react: ^19.2.6
  react-dom: ^19.2.6
  lucide-react: ^1.16.0
  class-variance-authority: ^0.7.1
  clsx: ^2.1.1
  tailwind-merge: ^3.6.0
  tw-animate-css: ^1.4.0
  zod: ^4.4.3
  "@vitejs/plugin-react": ^6.0.2
  "@tailwindcss/vite": ^4.3.0
  tailwindcss: ^4.3.0
  "@types/react": ^19.2.15
  "@types/react-dom": ^19.2.3
  "@tanstack/react-router": ^1.170.7
  "@storybook/addon-docs": ^10.4.1
  "@storybook/react-vite": ^10.4.1
  radix-ui: ^1.4.3
  storybook: ^10.4.1
  "@cloudflare/workers-types": ^4.20260524.1
  hono: ^4.12.22
  partyserver: ^0.5.6
  wrangler: ^4.94.0
overrides:
  vite: "catalog:"
  vitest: "catalog:"
peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: "*"
    vitest: "*"
minimumReleaseAgeExclude:
  - "@storybook/addon-docs@10.4.1"
  - "@storybook/builder-vite@10.4.1"
  - "@storybook/csf-plugin@10.4.1"
  - "@storybook/react-dom-shim@10.4.1"
  - "@storybook/react-vite@10.4.1"
  - "@storybook/react@10.4.1"
  - storybook@10.4.1
  - "@cloudflare/workers-types@4.20260524.1"
allowBuilds:
  esbuild: true
  sharp: true
  workerd: true
