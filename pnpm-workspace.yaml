packages:
  - apps/*
  - packages/*
  - tools/*

catalogMode: prefer

catalog:
  "@types/node": ^24.12.4
  typescript: ^5
  vite: npm:@voidzero-dev/vite-plus-core@latest
  vitest: npm:@voidzero-dev/vite-plus-test@latest
  vite-plus: latest
  react: ^19.2.6
  react-dom: ^19.2.6
  lucide-react: ^1.16.0
  class-variance-authority: ^0.7.1
  clsx: ^2.1.1
  tailwind-merge: ^3.6.0
  tw-animate-css: ^1.4.0
  "@vitejs/plugin-react": ^6.0.2
  "@tailwindcss/vite": ^4.3.0
  tailwindcss: ^4.3.0
  "@types/react": ^19.2.15
  "@types/react-dom": ^19.2.3
  "@radix-ui/react-slot": ^1.2.4
  "@tanstack/react-router": ^1.170.7
overrides:
  vite: "catalog:"
  vitest: "catalog:"
peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: "*"
    vitest: "*"
